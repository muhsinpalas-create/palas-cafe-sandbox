name: PALAS Training CI

on:
  pull_request:
    branches: [main]

jobs:
  training-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify training file is in the expected safe state
        run: |
          grep -q "# CONFLICT VERSION A" training/first-commit.md
